appId: io.bostonai.dimple
productName: Dimple
copyright: Copyright © 2026 Aaron Grace
directories:
  output: release
files:
  - dist/**/*
  - electron/**/*
  - package.json
asar: true
win:
  target:
    - nsis
    - portable
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  shortcutName: Dimple
  artifactName: Dimple-${version}-windows-setup.${ext}
portable:
  artifactName: Dimple-${version}-windows-portable.${ext}
mac:
  target:
    - dmg
    - zip
  category: public.app-category.games
  artifactName: Dimple-${version}-mac-${arch}.${ext}
linux:
  target:
    - AppImage
    - tar.gz
  category: Game
  executableName: Dimple
  artifactName: Dimple-${version}-linux-${arch}.${ext}
  synopsis: Dimple — a buddy inside a signed distance field
  desktop:
    Name: Dimple
    Terminal: false
    StartupNotify: false
publish:
  - provider: github
    owner: AaronGrace978
    repo: RayMarchPrime
